<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>泰国双城记 · 迷你版</title>
<style>
:root{
  --bg:#f3f7f4;
  --card:#ffffff;
  --ink:#1d2a26;
  --dim:#6c7b75;
  --brand:#0f6b52;
  --brand2:#e6a23c;
  --line:#e3eae6;
  --danger:#c45b3c;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;padding:14px 14px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#2ca381);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex:none;box-shadow:0 4px 10px rgba(15,107,82,.25)}
.brand h1{font-size:16px;line-height:1.2}
.brand p{font-size:11px;color:var(--dim)}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--dim);padding:5px 10px;white-space:nowrap}
.hero{background:linear-gradient(130deg,#0f6b52,#2ca381);border-radius:20px;padding:18px 17px;color:#fff;margin-bottom:14px}
.hero h2{font-size:21px;line-height:1.35;font-weight:800}
.hero p{font-size:12.5px;opacity:.9;margin-top:5px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.quick a,.quick button{display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:13px;padding:10px 6px;font-size:13px;font-weight:700;text-decoration:none}
.section{margin:16px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.section h3{font-size:16px}
.section span{font-size:11px;color:var(--dim)}
.daystrip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daychip{flex:none;width:60px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer}
.daychip .d{font-size:11px;color:var(--dim)}
.daychip .n{font-size:17px;font-weight:800;margin-top:2px}
.daychip small{display:block;font-size:9.5px;color:#93a09b;margin-top:1px}
.daychip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.daychip.on .d,.daychip.on small{color:rgba(255,255,255,.8)}
.daychip.on .n{color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.day-head h2{font-size:17px;line-height:1.35}
.day-head .tag{flex:none;font-size:10.5px;color:#0b6b4c;background:#e2f2ea;border-radius:999px;padding:3px 8px;white-space:nowrap;margin-top:3px}
.tipbox{background:#fff8e9;border:1px solid #f3e2bc;border-radius:12px;padding:9px 11px;margin-bottom:9px}
.tipbox p{font-size:12px;color:#7a6231;margin:3px 0;display:flex;gap:5px}
.tipbox p::before{content:"•";color:#d99b2b}
.item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{flex:none;font-size:11px;font-weight:800;color:var(--brand);background:#e7f3ee;border-radius:9px;padding:4px 6px;height:fit-content;min-width:52px;text-align:center}
.item .body{flex:1;min-width:0}
.item .body .nm{font-weight:800;font-size:15px;line-height:1.3}
.item .body .rv{font-size:12.3px;color:#52615c;margin-top:3px}
.item .body .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:10.5px;background:#f0f4f1;color:#5b6c65;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.book{background:#fdeadd;color:#b0471f}
.actrow{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:700;border:none;cursor:pointer;text-decoration:none;background:#eef4f0;color:#0d5d47}
.btn.primary{background:var(--brand);color:#fff}
.btn.gold{background:#fff3dd;color:#9a6500}
.dining{background:#fbf8ef;border-radius:12px;padding:9px 11px;margin-top:8px}
.dining h4{font-size:12px;color:#9a6500}
.dining p{font-size:12px;color:#5a6b63;margin-top:2px}
.meal{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#42524b;padding-top:3px}
.meal b{color:#b0471f;white-space:nowrap;font-weight:600}
.foot-note{margin-top:16px;text-align:center;font-size:11px;color:#97a59f;line-height:1.7}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  display:flex;
}
.tabbar button{flex:1;border:none;background:none;padding:7px 2px;font-size:10px;color:#8a9891;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;cursor:pointer}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.on{color:var(--brand);font-weight:700}
.panel{display:none}
.panel.on{display:block}
.sheet{position:fixed;inset:0;background:rgba(20,35,30,.42);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .handle{width:38px;height:4px;background:#dfe6e2;border-radius:4px;margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:3px}
.sheet .sub{font-size:12px;color:var(--dim);margin-bottom:12px}
.sheet .addr{background:#f3f7f4;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#3d4d46;margin-bottom:12px;word-break:break-all}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.listitem{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.listitem input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.listitem .txt{font-size:13px;flex:1}
.listitem .deadline{font-size:11px;color:var(--danger);white-space:nowrap}
.hotel{border-left:4px solid var(--brand)}
.flight{border-left:4px solid var(--brand2)}
.mini-note{font-size:11.5px;color:#8b9892;margin-top:8px;text-align:center}
@media (min-width:600px){
  .app{max-width:560px}
  .tabbar .box{max-width:560px}
}
</style>
</head>
<body>

<div id="app-lock" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(150deg,#0f6b52,#2ca381);display:flex;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;padding:24px">
  <div style="text-align:center;max-width:300px;width:100%">
    <div style="font-size:44px;line-height:1">🔒</div>
    <h1 style="font-size:21px;margin:14px 0 6px;letter-spacing:.04em">泰国双城记 · 8 天行程</h1>
    <p style="font-size:13px;opacity:.85;margin-bottom:18px">输入四位访问密码后查看</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" style="width:100%;box-sizing:border-box;text-align:center;font-size:24px;letter-spacing:10px;padding:10px 0;border:none;border-radius:14px;outline:none;color:#123a2d">
    <button id="pin-btn" style="width:100%;box-sizing:border-box;margin-top:12px;background:#e6a23c;border:none;border-radius:14px;padding:13px 0;font-size:16px;font-weight:800;color:#402a00;cursor:pointer">进入行程</button>
    <p id="pin-err" style="display:none;color:#ffd8c8;font-size:12.5px;margin-top:10px">密码不对，请再试一次</p>
  </div>
</div>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">✈</div>
      <div>
        <h1 id="app-title"></h1>
        <p id="app-dates"></p>
      </div>
    </div>
    <span class="pill" id="app-count"></span>
  </header>

  <div id="view-行程" class="panel on">
    <div class="hero">
      <h2 id="hero-day">点下面第几天开始浏览</h2>
      <p id="hero-sub">每站都能一键导航 / 复制定位打车</p>
      <div class="quick">
        <button data-goto="map">🗺 打开全部地图</button>
        <button data-goto="check">📋 出发前清单</button>
      </div>
    </div>
    <div id="day-root"></div>
  </div>
  <div id="view-清单" class="panel"></div>
  <div id="view-出行" class="panel"></div>
</div>

<nav class="tabbar">
  <button data-tab="行程" class="on"><span class="ic">🗓</span>行程</button>
  <button data-tab="清单"><span class="ic">✅</span>清单</button>
  <button data-tab="出行"><span class="ic">🛎</span>酒店航班</button>
</nav>

<div class="sheet" id="sheet-nav">
  <div class="box">
    <div class="handle"></div>
    <h3 id="sheet-title">导航到此</h3>
    <p class="sub">选择地图 App 打开；打车请先复制定位，再到 Grab 粘贴。</p>
    <div class="addr" id="sheet-addr"></div>
    <div class="row">
      <a class="btn primary" id="lnk-apple" target="_blank" rel="noopener">🍎 苹果地图</a>
      <a class="btn primary" id="lnk-google" target="_blank" rel="noopener">🧭 谷歌地图</a>
      <a class="btn primary" id="lnk-amap" target="_blank" rel="noopener">🗺 高德地图</a>
      <button class="btn gold" id="btn-copy">📋 复制定位</button>
      <a class="btn" href="https://www.grab.com" target="_blank" rel="noopener" style="grid-column:1/-1">🚕 打开 Grab（官网）</a>
    </div>
    <p class="mini-note">泰国打车通常用 Grab；复制下方定位后，在 Grab 里粘贴地点即可叫车。</p>
  </div>
</div>

<div class="sheet" id="sheet-maps">
  <div class="box">
    <div class="handle"></div>
    <h3>全部行程地图</h3>
    <p class="sub">以下任选一个打开：</p>
    <div class="row">
      <a class="btn primary" id="map-all-google" target="_blank" rel="noopener">🧭 谷歌地图</a>
      <a class="btn primary" id="map-all-apple" target="_blank" rel="noopener">🍎 苹果地图</a>
      <button class="btn" id="btn-close-maps">关闭</button>
    </div>
    <p class="mini-note" id="map-all-info"></p>
  </div>
</div>

<script>
(function(){
  var TRIP = JSON.parse(document.getElementById('trip-data').textContent);
  var PERIOD = {morning:'上午', noon:'中午', afternoon:'下午', evening:'晚上'};
  var state = { day: 0, tab: '行程' };

  document.getElementById('app-title').textContent = '泰国双城记 · 迷你版';
  document.getElementById('app-dates').textContent = TRIP.days[0].date + ' → ' + TRIP.days[TRIP.days.length-1].date;
  document.getElementById('app-count').textContent = TRIP.days.length + ' 天行程';

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function mapLinks(p){
    var q = encodeURIComponent(p.lat + ',' + p.lng);
    return {
      apple: 'https://maps.apple.com/?ll=' + p.lat + ',' + p.lng + '&q=' + encodeURIComponent(p.name),
      google: 'https://www.google.com/maps/search/?api=1&query=' + q,
      amap: 'https://uri.amap.com/marker?position=' + p.lng + ',' + p.lat + '&name=' + encodeURIComponent(p.name) + '&coordinate=wgs84&callnative=1'
    };
  }

  function renderDayStrip(){
    var h = TRIP.days.map(function(d,i){
      var d2 = d.date.slice(5).replace('-','/');
      return '<div class="daychip' + (i===state.day?' on':'') + '" data-day="' + i + '"><div class="d">' + d2 + '</div><div class="n">' + (i+1) + '</div><small>' + esc(d.weekday) + '</small></div>';
    }).join('');
    return '<div class="daystrip">' + h + '</div>';
  }

  function mealHTML(list){
    if(!list || !list.length) return '';
    return '<div class="dining"><h4>🍜 今日吃喝</h4>' + list.map(function(m){
      var ds=(m.dishes||[]).map(function(x){return '<div class="meal"><span>' + esc(x.name) + '</span><b>' + esc(x.price||'') + '</b></div>';}).join('');
      return '<p style="margin-top:6px;font-weight:700">' + esc(m.meal) + ' · ' + esc(m.place) + (m.hours?('（'+esc(m.hours)+'）'):'') + '</p>' + ds;
    }).join('') + '</div>';
  }

  function slotHTML(s){
    var meta='';
    if(s.rating) meta+='<span class="chip">★ '+esc(String(s.rating))+'</span>';
    if(s.openingHours) meta+='<span class="chip">🕐 '+esc(s.openingHours)+'</span>';
    if(s.ticketPrice) meta+='<span class="chip">🎫 '+esc(s.ticketPrice)+'</span>';
    if(s.transport && s.transport.mode) meta+='<span class="chip">🚕 '+esc(s.transport.mode)+'</span>';
    if(s.needsBooking) meta+='<span class="chip book">⚠ 建议提前'+s.leadDays+'天订</span>';
    return '<div class="item"><div class="t">' + esc(s.time||'') + '</div><div class="body">' +
      '<div class="nm">' + esc((PERIOD[s.period]?PERIOD[s.period]+'·':'') + s.name) + '</div>' +
      (s.review?'<div class="rv">'+esc(s.review)+'</div>':'') +
      '<div class="meta">' + meta + '</div>' +
      '<div class="actrow">' +
        '<button class="btn primary" data-nav data-name="'+esc(s.name)+'" data-lat="'+s.lat+'" data-lng="'+s.lng+'">🧭 导航</button>' +
        '<button class="btn gold" data-copy data-name="'+esc(s.name)+'" data-lat="'+s.lat+'" data-lng="'+s.lng+'">🚕 打车</button>' +
      '</div></div></div>';
  }

  function renderDay(){
    var d = TRIP.days[state.day];
    var h = renderDayStrip();
    h += '<div class="card day-head"><div><h2>第 ' + (state.day+1) + ' 天 · ' + esc(d.weekday) + ' ' + esc(d.date) + '</h2><div class="tag">' + esc(d.theme||'') + '</div></div></div>';
    if(d.tips && d.tips.length) h += '<div class="tipbox">' + d.tips.map(function(t){return '<p>'+esc(t)+'</p>';}).join('') + '</div>';
    (d.slots||[]).forEach(function(s){ h += '<div class="card">' + slotHTML(s) + '</div>'; });
    h += '<div class="card">' + (mealHTML(d.dining)||'<p style="font-size:12px;color:var(--dim)">本日无单独餐饮安排</p>') + '</div>';
    document.getElementById('hero-day').textContent = '第 ' + (state.day+1) + ' 天 · ' + esc(d.weekday);
    document.getElementById('hero-sub').textContent = esc(d.theme||'');
    document.getElementById('day-root').innerHTML = h;
    bindChips();
  }

  function bindChips(){
    var chips = document.querySelectorAll('.daychip');
    chips.forEach(function(c){ c.addEventListener('click', function(){ state.day = Number(c.getAttribute('data-day')); renderDay(); }); });
    document.querySelectorAll('[data-nav]').forEach(function(b){ b.addEventListener('click', function(){ openNav(b); }); });
    document.querySelectorAll('[data-copy]').forEach(function(b){ b.addEventListener('click', function(){ openCopy(b); }); });
  }

  var cur=null;
  function openNav(el){
    cur={name:el.getAttribute('data-name'),lat:Number(el.getAttribute('data-lat')),lng:Number(el.getAttribute('data-lng'))};
    var links=mapLinks(cur);
    document.getElementById('sheet-title').textContent='导航：'+cur.name;
    document.getElementById('sheet-addr').textContent=cur.name+'\n'+cur.lat+', '+cur.lng;
    document.getElementById('lnk-apple').href=links.apple;
    document.getElementById('lnk-google').href=links.google;
    document.getElementById('lnk-amap').href=links.amap;
    showSheet('sheet-nav');
  }
  function openCopy(el){
    cur={name:el.getAttribute('data-name'),lat:Number(el.getAttribute('data-lat')),lng:Number(el.getAttribute('data-lng'))};
    var links=mapLinks(cur);
    document.getElementById('sheet-title').textContent='打车：'+cur.name;
    document.getElementById('sheet-addr').textContent=cur.name+'\n'+cur.lat+', '+cur.lng+'\n'+links.google;
    document.getElementById('lnk-apple').href=links.apple;
    document.getElementById('lnk-google').href=links.google;
    document.getElementById('lnk-amap').href=links.amap;
    showSheet('sheet-nav');
  }

  function renderChecklist(){
    var items = (TRIP.reminders||[]).map(function(r){
      var dt=new Date(TRIP.startDate+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()-r.leadDays);
      return {item:r.item, leadDays:r.leadDays, date:dt.toISOString().slice(0,10)};
    }).sort(function(a,b){return a.date<b.date?-1:1;});
    var h='<div class="card"><p style="font-size:13px;color:var(--dim);margin-bottom:8px">按建议提前天数倒推，完成一项勾一项：</p>';
    items.forEach(function(r){ h+='<label class="listitem"><input type="checkbox"><span class="txt">'+esc(r.item)+'</span><span class="deadline">'+r.date+' 前</span></label>'; });
    h+='</div>';
    document.getElementById('view-清单').innerHTML=h;
  }

  function renderTravel(){
    var h='<div class="section"><h3>航班</h3><span>按票面整理</span></div>';
    (TRIP.flights.candidates||[]).forEach(function(f){
      h+='<div class="listitem flight"><div class="txt"><b>'+esc(f.label)+'</b><br><span style="font-size:12px;color:var(--dim)">'+esc(f.code)+' · '+esc(f.time)+'</span><br><span style="font-size:11.5px;color:#8a9791">'+esc(f.note||'')+'</span></div></div>';
    });
    h+='<div class="section"><h3>酒店</h3><span>已订</span></div>';
    (TRIP.hotelAreas||[]).forEach(function(x){
      (x.options||[]).forEach(function(o){
        h+='<div class="listitem hotel"><div class="txt"><b>'+esc(o.name)+'</b><br><span style="font-size:12px;color:var(--dim)">'+esc(x.area)+'</span><br><span style="font-size:11.5px;color:#8a9791">'+esc(o.note||'')+'</span></div></div>';
      });
    });
    h+='<div class="section"><h3>通用提示</h3><span>精简</span></div><div class="card">'+(TRIP.tips||[]).slice(0,5).map(function(t){return '<div class="tipbox" style="margin-bottom:5px"><p>'+esc(t)+'</p></div>';}).join('')+'</div>';
    document.getElementById('view-出行').innerHTML=h;
  }

  function openAllMaps(){
    var pts=[];
    TRIP.days.forEach(function(d){(d.slots||[]).forEach(function(s){pts.push(s);});});
    var g=pts.map(function(p){return encodeURIComponent(p.lat+','+p.lng);}).join('/');
    document.getElementById('map-all-google').href='https://www.google.com/maps/dir/'+g;
    var a=pts[0];
    document.getElementById('map-all-apple').href='https://maps.apple.com/?ll='+a.lat+','+a.lng+'&q='+encodeURIComponent(TRIP.days[0].slots[0].name);
    document.getElementById('map-all-info').textContent='全部 '+pts.length+' 站，按行程顺序排列。跨城线路（曼谷↔清迈）较长，分段看更清楚。';
    showSheet('sheet-maps');
  }

  function showSheet(id){ document.getElementById(id).classList.add('on'); }
  function hideSheets(){ document.querySelectorAll('.sheet').forEach(function(s){ s.classList.remove('on'); }); }

  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){
      state.tab=b.getAttribute('data-tab');
      document.querySelectorAll('.tabbar button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
      var mapPanels={'行程':'view-行程','清单':'view-清单','出行':'view-出行'};
      document.getElementById(mapPanels[state.tab]).classList.add('on');
      if(state.tab==='清单') renderChecklist();
      if(state.tab==='出行') renderTravel();
    });
  });
  document.querySelectorAll('[data-goto]').forEach(function(b){
    b.addEventListener('click', function(){
      var g=b.getAttribute('data-goto');
      if(g==='map'){ openAllMaps(); return; }
      var tabmap={'check':'清单'};
      document.querySelector('.tabbar button[data-tab="'+tabmap[g]+'"]').click();
    });
  });
  document.getElementById('btn-copy').addEventListener('click', function(){
    var txt=document.getElementById('sheet-addr').textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){document.getElementById('btn-copy').textContent='✓ 已复制';setTimeout(function(){document.getElementById('btn-copy').textContent='📋 复制定位';},1500);}); }
    else { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); document.getElementById('btn-copy').textContent='✓ 已复制'; setTimeout(function(){document.getElementById('btn-copy').textContent='📋 复制定位';},1500); }
  });
  document.getElementById('btn-close-maps').addEventListener('click', hideSheets);
  document.querySelectorAll('.sheet').forEach(function(s){ s.addEventListener('click', function(e){ if(e.target===s) s.classList.remove('on'); }); });

  renderDay();
  renderChecklist();
})();
</script>

<script>
(function(){
  function djb2(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); } return (h>>>0).toString(16); }
  var EXPECT='7c78c4ea';
  var lock=document.getElementById('app-lock');
  var inp=document.getElementById('pin');
  var err=document.getElementById('pin-err');
  function unlock(){ if(lock){ lock.style.display='none'; } try{ sessionStorage.setItem('trip-lock','1'); }catch(e){} }
  function check(){
    var v=(inp&&inp.value||'').trim();
    if(v && djb2(v)===EXPECT){ err.style.display='none'; unlock(); }
    else { err.style.display='block'; if(inp){ inp.value=''; inp.focus(); } }
  }
  try{ if(sessionStorage.getItem('trip-lock')==='1'){ unlock(); } }catch(e){}
  if(inp){
    inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter') check(); });
    setTimeout(function(){ inp.focus(); }, 200);
  }
  var btn=document.getElementById('pin-btn');
  if(btn){ btn.addEventListener('click', check); }
})();
</script>
</body>
